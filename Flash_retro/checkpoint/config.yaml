name: vaedifm_uspto50k_retro
version: vaedifm_uspto50k_retro
chem:
  reaction_data_dir: ./data/uspto50k
  reaction_file_tag: data
  file_type: pickle
data:
  train_transforms:
  - type: random_permute
    attr_name: elements
model:
  name: vaedifm_uniform
  flow:
    kappa:
      type: linear
    sigma:
      type: sqrtsquare
  mol_encoder:
    nlayer: 6
    dim: 256
    ntoken: 192
    nhead: 8
    dropout: 0.1
  merge_encoder:
    nlayer: 1
    dim: 256
    nhead: 8
    dropout: 0.1
  vae_decoder:
    nlayer: 12
    dim: 256
    nhead: 8
    dropout: 0.1
    out_logits: 4
    pred_diff: false
  decoder_only: true
  meanflow:
    num_layers: 6
    loss:
      path_type: linear
      weighting: uniform
      time_sampler: logit_normal
      time_mu: -0.4
      time_sigma: 1.0
      ratio_r_not_equal_t: 0.25
      adaptive_p: 1.0
      cfg_omega: 1.0
schedule_sampler:
  name: continuous-uniform
train:
  mode: retro
  loss_weights:
    bond: 1.0
    aroma: 1.0
    charge: 1.0
    element: 1.0
    meanflow: 0.01
  max_iters: 400000
  val_freq: 2000
  max_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.9999
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: cosine
    T_max: ${train.max_iters}
    eta_min: 1.0e-06
    warmup_steps: 2000
  seed: 42
  batch_size: 32
  num_workers: 8
  devices: 8
  num_nodes: 1
  num_sanity_val_steps: 1
  log_dir: ./logs
  resume: null
  wandb_project: null
  sample_num: 1
  sample_steps: 1
